        <p>圓安論氣功與丹道問與答(22)</p>
        <p>問：
初學者修煉，最忌諱的是什麼？</p>
        <p>答：
初學最忌心浮氣躁、貪求冒進。
急於通關、求速效、執著法門，
皆會偏離大道。丹道修煉講究循序漸進，
穩紮穩打，恪守清靜無為，不強求、不造作，
慢慢涵養先天真氣，方能走得穩、行得遠。</p>
