        <p>圓安論氣功與丹道問與答(21)</p>
        <p>問：
修丹道是否需要刻意追求各種氣感、境象？</p>
        <p>答：
絕不可刻意追求。
修煉中出現的冷暖、酥麻、光影等氣感境象，
皆是氣機運化的暫時表相，
執著於此便會心生貪念，
擾亂先天真氣。
修煉重在清靜無為、抱元守一，
不執著、不分辨一切境相，專注涵養本源，才是正途。</p>
