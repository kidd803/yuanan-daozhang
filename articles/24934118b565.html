        <p>圓安論氣功與丹道問與答(33)</p>
        <p>問：
外界干擾多，無法安心修煉該怎麼辦？</p>
        <p>答：
修煉的關鍵在心靜，而非外在環境。
即便外界喧囂，只需收攝心神，
不被外界聲音、事務干擾，
不隨外境轉動，守持內在清明覺知。
久而久之，無論處於何種環境，
都能做到心不動、神不亂，這才是真正的修煉功夫。</p>
