        <p>問：
通靈者為何敏感多疑、情緒極度不穩？</p>
        <p>答：
會無意識同步周遭所有人、無形靈體的情緒、
怨氣與負念，等同承擔萬般負能量。
長期浸染之下，心性脆弱、思緒紛亂、
敏感多慮成為常態。</p>
