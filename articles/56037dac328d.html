        <p>人生道悟</p>
        <p>歲月細水長流，浮生抱樸順道。心容萬緣而不滯，事觀諸相而澹然，心安無擾、順其自然，便是大道圓滿。</p>
        <p>世人終日奔忙勞形，一生馳求，所求無他，惟心定神清、日用安舒而已。眾人多執外境浮華，逐虛名、較得失，憂未來之無常，戀既往之塵跡，向外攀緣不休，卻不知：至真之福，不在奢華外求，而在平淡尋常、清靜本心之中。</p>
        <p>道法本然，世無全美...</p>
