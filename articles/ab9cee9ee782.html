        <p>人生五要
—— 立身之基：
積陰德者不逢惡；
惜福報者不致貧；
讀善書者不墮賤；
擇良友者不趨邪；
有志向者不盲目。</p>
        <p>❤ 積陰德：
《道德經》有言：「天道無親，常與善人。」默然行善，待人厚道，無求外報，
