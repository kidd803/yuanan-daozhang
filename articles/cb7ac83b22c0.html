        <p>通靈覺知五十條正見問答(37)</p>
        <p>問：
通靈能否窺探、感知他人內心深處想法？</p>
        <p>答：
靈覺清淨層次足夠，
可感知他人隱藏情緒、
深層心念與潛意識慾望。
但隨意窺探、濫用感知，
會損傷陰德、耗散自身靈氣，為修行大忌。</p>
