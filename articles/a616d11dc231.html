道教「守一」修法經典語錄摘編</p>
        <p>1. 《道德經·第三十九章》
天得一以清，地得一以寧，神得一以靈，谷得一以盈，萬物得一以生，侯王得一以為天下貞。</p>
        <p>2. 《太平經·守一明法》
守一之法，萬神可袪；守一之術，謂之無極，天地之樞紐，萬事之根機。
夫守一者，可以度世，可以消災，可以事君，可以不死...</p>
