        <p>通靈覺知五十條正見問答(26)</p>
        <p>問：
通靈體質為何容易鬼壓床、驚恐惡夢？</p>
        <p>答：
自身陽氣虛弱、神氣不固，
夜間陰氣旺盛之時，容易被陰靈靠近、
氣場壓制，故而頻繁遭遇夢魘、
鬼壓床、夜半驚醒、心生恐懼。</p>
