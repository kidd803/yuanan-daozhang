        <p>問：
乩童與廟宇的關係是什麼？</p>
        <p>答：
多數乩童依附於民間廟宇，
為廟宇主持儀式、服務信眾，
廟宇提供神壇場地與信仰支撐，
二者相互依存，是民間廟會的重要組成。</p>
