紫微斗數｜太陰星 星性與組合解析
太陰星為紫微斗數十四主星之「中天星」，五行屬癸陰水，在天為月之精，化氣為「富」，兼主「潔」；職司為田宅主，亦為財星與母星，核心象義為月亮、陰柔、養育、積蓄、不動產與女性親屬。其星性強弱高度依「廟旺利陷」（月相盈虧）而定，夜生人得用，晝生人力量減半；組合則決定其「富」與「潔」的發揮方向，或轉為陰鬱、波動之弊。</p>
