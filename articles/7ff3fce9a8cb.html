        <p>圓安論氣功與丹道問與答(13)</p>
        <p>問：平常生活如何修行</p>
        <p>答：世俗之中修身養性，
乃是於紛囂塵世裡覓得清寧，
在浮華繁華中守持本心清明。
靜坐窗前，暖陽輕灑顏面，
唇角淺淺揚起，眸光澄澈且堅定。
懷一顆恬淡平和之心，觀照世間萬物；
不為俗事紛擾，不被貪欲桎梏束縛。
如是修持，方能於紅塵俗世之間，
煉就一顆超塵脫俗、不染塵埃的道心。
這樣才有 醫世 能力。</p>
