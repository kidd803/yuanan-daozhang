        <p>通靈覺知五十條正見問答(5)</p>
        <p>問：
擁有通靈能力，是否等同道行高深、具足神通？</p>
        <p>答：
並非如此。通靈只是單純的感知本能，不代表修為、
悟道與德行。</p>
        <p>多數人僅有靈敏感應，心性浮躁、德行虧缺，
只是敏感體質，並非修行有道之人。</p>
