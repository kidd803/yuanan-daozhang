        <p>圓安論氣功與丹道問與答(25)</p>
        <p>問：
修煉時該如何調息，是否要刻意控制呼吸？</p>
        <p>答：
丹道調息從非刻意控制呼吸，
切忌強行深呼吸、憋氣、數息。
只需順其自然，保持呼吸綿綿細細、
若有若無，不執著、不干涉，讓呼吸回歸本然狀態。心靜則息自調，息調則神自安，
後天呼吸漸歸平和，方能孕育先天真炁。</p>
