        <p>執念難破、俗緣難放，本是凡人常態</p>
        <p>有人詢問：
修道之理雖曉，凡事須看破執著、放下牽絆，可自身身陷塵緣，偏偏看不破、放不下，該如何處置？</p>
        <p>須知凡夫稟陰陽濁氣而生，自幼浸染塵俗利害、親情牽掛、物欲牽纏，心被六根牽引，元神為嗜欲所縛，無法頓然勘破萬緣，原是合乎物性，不必自責心鈍、根基淺薄。大道從不強令凡人一朝斬盡塵執，頓入空明，放下本是循序漸進之功，非一蹴而就之事...</p>
