        <p>問：
乩童能醫治疾病嗎？</p>
        <p>答：
民間信仰中，文乩會賜予民俗藥方、符水，
認為可化解邪病、業障病，但僅屬民間信仰行為，
無法替代正規醫學治療，不可迷信。</p>
