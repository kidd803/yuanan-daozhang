        <p>道家修心：破我執，得自在</p>
        <p>道家修真之要，首在破我執。</p>
        <p>所謂我執者，乃執己見、困己私、重己得失、滯己情懷。執於自我之相，以一己好惡衡萬事，牽於榮辱、縛於过往、困於愛憎，是人間煩惱、心神勞苦之根源。</p>
        <p>《道德經》云：「自見者不明，自是者不彰。」</p>
        <p>大道無私，萬物同源、天地一氣。人心一旦立「我」為界，便生分別、起貪求...</p>
