        <p>圓安論氣功與丹道問與答(35)</p>
        <p>問：
修煉時該如何對待念頭，是要徹底滅絕念頭嗎？</p>
        <p>答：
並非徹底滅絕念頭，
後天雜思念頭是人之常情，
強行滅念只會壓抑心神、適得其反。</p>
        <p>修煉要義是不隨念轉、不執念起，
念頭來時不追隨、不厭惡，安然覺知，
念頭自去，守持本來的清明覺性。</p>
        <p>做到念起不隨，神炁自然凝聚，便是守一的真義。</p>
