        <p>良言難入耳，皆由心執自困</p>
        <p>忠言難入人心，大抵皆是執念自縛、違逆天道所致。成年人的通達曉悟，便從虛心接納旁人勸勉、省察自身言行起步。</p>
        <p>旁人再三勸導、殷殷叮囑，依舊執拗偏行、不肯聽從，皆是心氣執滯、悖於自然之道。他人出於誠心提點，卻滿心猜忌、拒不采信，不過是心有障礙，難明事理。更有甚者，面對善意勸解反倒心生怨懟、反目相向，終是行事有失，自招困厄。</p>
        <p>世間至為可貴者...</p>
