        <p>圓安論氣功與丹道問與答(30)</p>
        <p>問：
修煉時總容易昏沉犯困，該怎麼解決？</p>
        <p>答：
昏沉一是身體勞累、元氣不足，
二是心神放鬆過度、失於覺照。
此時可微微提振心神，保持清明覺知，
不讓自己墜入昏沉；也可適度調整身姿，
放鬆頭頂、舒展脊背，待身心舒緩後，
再慢慢收心靜慮。切忌強撐昏沉修煉，
否則毫無功效，還會損傷神氣。</p>
