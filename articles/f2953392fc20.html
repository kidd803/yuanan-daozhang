        <p>道德經第二十九章 淺釋</p>
        <p>【原文】
將欲取天下而為之，吾見其不得已。天下神器，不可為也，不可執也。為者敗之，執者失之。故物或行或隨，或歔或吹，或強或羸，或載或隳。是以聖人去甚，去奢，去泰。</p>
        <p>【要旨】
本章申明「無為而治」之旨，以天下為神聖之物，不可強為、不可執持；聖人順應物性，棄極端、去奢侈、戒過度...</p>
