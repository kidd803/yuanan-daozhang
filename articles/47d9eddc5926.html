        <p>圓安論氣功與丹道問與答(20)</p>
        <p>問：
修煉時心神總是紛亂，該如何調整？</p>
        <p>答：
心神紛亂是後天雜思妄念外馳所致，
切勿強行壓制。只需專注收攝身心，
不隨雜思走動，不逐外境聲色，
慢慢放鬆身形、平靜呼吸，守持本然覺知，
不迎不拒。久而久之，雜思漸消，
心神歸一，自然漸入清靜之境。</p>
