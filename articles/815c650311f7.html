        <p>圓安論氣功與丹道問與答(32)</p>
        <p>問：
修煉多久才能有所成效，
如何正確看待修煉進度？</p>
        <p>答：
丹道修煉無固定時限，因人根基、
心性不同而有差異。
切勿執著進度、追求成效，越求越急、
越急越偏。
只需每日堅持清靜修煉，
不間斷、不冒進，慢慢涵養元炁、
磨練心性，身心自然會慢慢轉化。
不求效而效自至，這是修煉的根本規律。</p>
