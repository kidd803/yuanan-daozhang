        <p>問：
為何東南沿海地區盛行乩童文化？</p>
        <p>答：
東南沿海古時多自然災害、
海難，醫療與物質條件落后，
民眾寄託於神明庇佑，乩童作為人神媒介，
能滿足民眾消災祈福的心理需求，故而流傳興盛。</p>
