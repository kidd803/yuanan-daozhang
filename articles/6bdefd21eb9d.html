        <p>通靈覺知五十條正見問答(28)</p>
        <p>問：
通靈所見佛菩薩、神明聖像，皆是真實嗎？</p>
        <p>答：
六道眾靈皆可幻化聖相。
善靈顯光明莊嚴之態，
陰靈亦會偽裝神明、祖師、聖像迷惑人心；
有光未必是善靈，無相清淨才是真道。</p>
