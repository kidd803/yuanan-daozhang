        <p>圓安論氣功與丹道問與答(29)</p>
        <p>問：
何為先天真炁，如何判斷自身真炁發動？</p>
        <p>答：
先天真炁是生命本源能量，非後天呼吸之氣、血氣。真炁發動時，身心會自然生出溫暖、舒泰、渾厚之感，無需意念驅動，氣機自會緩慢流動，心神格外清寧，無雜思紛擾，是一種自然的、被動的身心體感，絕非刻意追求出來的氣感。</p>
