        <p>圓安論氣功與丹道問與答(26)</p>
        <p>問：
修煉是否必須打坐，打坐姿勢有硬性要求嗎？</p>
        <p>答：
打坐是修煉的常見方式，但非唯一方式，
核心在於心神清靜，而非執著姿勢。</p>
        <p>打坐時以身心放鬆、端正穩固為要，
單盤、雙盤、正坐皆可，以自身舒適不疲憊為準，
不強求難受姿勢。</p>
        <p>若無法久坐，行住坐臥間皆可守心收神，
時時刻刻抱元守一，皆是修煉。</p>
