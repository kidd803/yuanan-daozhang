        <p>【原文】
道常無名，樸雖小，天下莫能臣也。侯王若能守之，萬物將自賓。天地相合，以降甘露，民莫之令而自均。始制有名，名亦既有，夫亦將知止，知止所以不殆。譬道之在天下，猶川谷之於江海。</p>
        <p>【要旨】
本章言道體無名、至樸至微，卻為萬物之本；侯王守道則天下自服，知止不殆...</p>
