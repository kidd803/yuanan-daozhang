        <p>玄門悟道偈
一入玄門脫凡身，永奉三清不二臣。
今朝悟徹真常道，從此紅塵任我巡。
斬斷俗緣無掛礙，遠辭煙火離凡塵。
心存太乙凌雲志，身逐仙光度萬春。
靜煉元胎凝紫炁，閒觀日月轉星辰。
看破浮華皆幻妄，悟通天機斷俗因。
靈臺淨寂無塵染，道骨清虛葆世真。
朝隨鶴影遨雲海，暮伴松風養本神。
獨坐蒲團觀妙相，閒斟靈露養天真。
淡看富貴如雲夢...</p>
