        <p>認識乩童文化問與答(1)
我以民俗視角，梳理乩童文化的起源、儀式、分類、禁忌、爭議等內容，客觀講解這一民間信仰現象。</p>
        <p>問：何謂乩童？</p>
        <p>答：乩童又稱僮身、童乩，是華人民間信仰中，自稱能讓神明、祖靈附體，充當人神溝通媒介的角色，源於上古巫覡文化，盛行於閩、粵、台及東南亞華人地區，是民間巫俗與民俗信仰結合的產物。</p>
