        <p>通靈覺知五十條正見問答(12)</p>
        <p>問：
普通人偶爾出現靈異感應，算是通靈體質嗎？</p>
        <p>答：
屬於淺層靈覺觸發。
莫名預感、心慌不安、預知夢、被注視之感、
無緣由低落，皆是先天靈性短暫甦醒，
為正常現象，並非深度通靈。</p>
