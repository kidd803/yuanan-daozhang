        <p>通靈覺知五十條正見問答(22)</p>
        <p>問：
如何分辨靈感是真靈傳訊，還是自身幻想？</p>
        <p>答：
真靈訊息平靜客觀、無情緒煽動、
突如其來、不受自我掌控；
自身幻想夾雜貪求、恐懼、期待、
個人好惡，反覆牽掛、由思維編造，二者極易分辨。</p>
