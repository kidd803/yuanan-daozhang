        <p>道德經第三十一章 淺釋</p>
        <p>【原文】
夫兵者，不祥之器，物或惡之，故有道者不處。君子居則貴左，用兵則貴右。兵者不祥之器，非君子之器，不得已而用之，恬淡為上。勝而不美，而美之者，是樂殺人。夫樂殺人者，則不可以得志於天下矣。吉事尚左，凶事尚右。偏將軍處左，上將軍處右，言以喪禮處之。殺人之眾，以悲哀泣之，戰勝以喪禮處之。
【要旨】
本章申明兵戎為不祥之物，有道者不輕用...</p>
