        <p>人漸黃昏水漸窮，
繁華落盡草叢叢。
從來好景不常在，
自古花無百日紅。</p>
        <p>天地循環，本乎陰陽消長之天道。水流有竭，暮色將臨，是物勢盈極而虧之象；繁華歸於蕪草，盛極轉衰，乃自然不易之定數，合《道德經》「物壯則老，是謂不道，不道早已」之旨。</p>
        <p>世間艷景、榮華，皆是氣聚而成之幻象...</p>
