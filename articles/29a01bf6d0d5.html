        <p>原文：太上，下知有之；其次，親而譽之；其次，畏之；其次，侮之。信不足焉，有不信焉。悠兮其貴言。功成事遂，百姓皆謂：「我自然」。</p>
        <p>白話譯解：最好的治世者，百姓僅知其存在；次一等者，百姓親近讚譽；再次者，百姓畏懼；最下者，百姓輕侮。統治者誠信不足，百姓自然不信。有道之君從容不迫...</p>
