        <p>道德經第七章 以《清靜經》互證解
道德經第七章原文：
天長地久。天地所以能長且久者，
以其不自生，故能長生。
是以聖人後其身而身先，外其身而身存。
非以其無私邪？故能成其私。</p>
        <p>一、天長地久，以其不自生
《清靜經》云：「大道無情，運行日月；大道無名，長養萬物。」
天地之所以長久，在於其清靜無為、不為己生。天地順道而行，無私無我，不貪生、不執有...</p>
