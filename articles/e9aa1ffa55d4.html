        <p>道德經第五十五章</p>
        <p>【原文】
含德之厚，比於赤子。毒蟲不螫，猛獸不據，攫鳥不搏。骨弱筋柔而握固。未知牝牡之合而朘作，精之至也。終日號而不嗄，和之至也。知和曰常，知常曰明。益生曰祥。心使氣曰強。物壯則老，謂之不道，不道早已。</p>
        <p>【要旨】
本章以赤子喻厚德之人，言精和充盛、柔弱合道則長生；戒強梁益生、違逆自然，明守柔歸和之道。</p>
