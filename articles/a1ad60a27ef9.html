        <p>問：
通靈之人是否大多折壽、福緣淡薄？</p>
        <p>答：
不修善、不養陽、濫用能力之人，長期耗元傷神、陰氣侵體，必定虧損本命、折損福壽；若守神修身、心存光明、潔身自守，不僅不會折壽，更能靈性覺醒、身心安寧。</p>
