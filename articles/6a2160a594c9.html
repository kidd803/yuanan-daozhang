        <p>圓安論氣功與丹道問與答(28)</p>
        <p>問：
丹道修煉是否需要忌口，日常起居有何講究？</p>
        <p>答：
初修不必過度執著忌口，但需飲食清淡，少食辛辣油膩、厚重濁味之物，避免加重身體濁氣、擾亂氣機。起居需規律，早睡早起，不熬夜、不縱欲，節制房事，保養先天精元；減少聲色娛樂，避免精气神過度外馳，養成收攝身心的習慣。</p>
