        <p>《列子》全書八篇 精要口訣
一、天瑞第一
太易為先，氣形質全。
渾淪未判，天地乃分。
萬物生化，出機入機。
生死如環，順其自然。</p>
        <p>二、黃帝第二
華胥神游，心悟至真。
純氣內守，神全不侵。
虛心齋形，忘我無人。
順物應世，道乃可成。</p>
        <p>三、周穆王第三
