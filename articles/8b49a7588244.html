        <p>圓安論氣功與丹道問與答(23)</p>
        <p>問：
抱元守一是否是死盯身體某一部位？</p>
        <p>答：
並非如此。抱元是涵養先天生命能量，
收攝散於外的精气神，停止向外虧損；
守一是令心神不遊離，讓後天雜思靜定，
與本然覺知相合。真正的抱元守一，
是身心舒展、清透通達，而非僵滯死守、越坐越累。</p>
