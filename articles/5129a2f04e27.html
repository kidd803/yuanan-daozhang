        <p>道德經第七十五章</p>
        <p>【原文】
民之饑，以其上食稅之多，是以饑。
民之難治，以其上之有為，是以難治。
民之輕死，以其上求生之厚，是以輕死。
夫唯無以生為者，是賢於貴生。</p>
        <p>【要旨】
本章直指民間飢餓、難治、輕死之禍，皆源於統治者厚斂、有為、貴生；唯有不厚養其身、清靜無為者，勝過貴生厚己之人...</p>
