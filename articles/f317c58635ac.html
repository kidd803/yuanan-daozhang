        <p>安徽蒙城莊子祠</p>
        <p>據史書記載，北宋元豐元年（1078年）蒙城縣令秘書丞王兢為紀念戰國時期著名思想家、文學家、蒙城人莊子，在渦河北岸漆園故址首建了莊子祠堂。在此之後，莊子祠也成為很多人來蒙城必到的一處景點，大家都想瞻仰一下這位戰國時期偉大的文化家和思想家 。莊子祠正門是一座仿漢代樣式的白石門樓，正門兩側有進出的小門，供遊客進出。</p>
