        <p>問道清心文</p>
        <p>山藏清寂，雲渡虚空，世間萬象紛繁，唯向道之心，可破迷霧、歸本真。</p>
        <p>所謂問道，從非遠尋仙蹤、妄求玄異，而是於浮世浮沉中，叩問本心，修持方寸。道不在山海遙境，不在經卷繁辭，藏於朝暮清靜，隱於一念澄明。</p>
        <p>踏林徑而聽風，臨幽澗而觀水，觀萬物自然生息：春生夏長，秋收冬藏，流水不爭，浮雲無執，此皆是道之真貌。人於世間奔波，多被貪嗔牽絆...</p>
