        <p>通靈覺知五十條正見問答(11)</p>
        <p>問：
多數通靈者為何體弱、失眠、頭痛多夢？</p>
        <p>答：
長期往來陰陽兩界，陰氣侵蝕陽炁；
時常接收外來訊息，神識持續透支；
頻繁靈感會擾亂自身氣脈，
故而大多氣虛衰弱、精神不安、睡眠不寧。</p>
