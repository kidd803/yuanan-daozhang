        <p>道德經第五十章
【原文】
出生入死。
生之徒，十有三；死之徒，十有三；
人之生，動之於死地，亦十有三。
夫何故？以其生生之厚。蓋聞善攝生者，
陸行不遇兕虎，入軍不被甲兵。
兕無所投其角，虎無所措其爪，
兵無所容其刃。夫何故？以其無死地。</p>
