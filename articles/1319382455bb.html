        <p>道德經第六十九章</p>
        <p>【原文】
用兵有言：「吾不敢為主，而為客；不敢進寸，而退尺。」
是謂行無行；攘無臂；扔無敵；執無兵。
禍莫大於輕敵，輕敵幾亡吾寶。
故抗兵相若，哀者勝矣。</p>
        <p>【要旨】
本章言用兵之道以謙退不爭為上，戒輕敵之禍；主張以慈哀之心應戰，不主不進，故能無敵，合於道之寶。</p>
