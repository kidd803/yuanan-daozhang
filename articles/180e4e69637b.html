        <p>通靈覺知五十條正見問答(9)</p>
        <p>問：
何為：正通靈與邪通靈？</p>
        <p>答：
正通靈者，神智清醒、自主覺知、
心存善念，不貪名利、不懼異象、
不炫耀神通，唯感通清淨善靈；</p>
        <p>邪通靈者，依附陰靈煞氣，
以自身元氣交換能力、
依靠附體感應，耗損本命根基，屬旁門邪徑。</p>
