        <p>問：
喝酒、熬夜放縱，會封閉先天靈覺嗎？</p>
        <p>答：
酒精濁亂元神，熬夜耗損陽氣，
直接遮蔽本具靈性，讓靈感鈍化、
接收盡是雜訊。長期放縱，縱是天生靈體，
也會淪為平凡常人。</p>
