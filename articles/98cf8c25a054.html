        <p>通靈覺知五十條正見問答(4)
問：通靈感應是先天稟賦，還是後天修成？</p>
        <p>答：分為二種，
一為天生稟賦，先天氣場清透、
陰陽之門未封，自幼靈感敏銳；</p>
        <p>二為後天修持，藉由清心寡欲、
靜坐養神，慢慢喚醒靈覺感知，皆為靈性覺醒之路。</p>
