        <p>道德經第六十一章</p>
        <p>【原文】
大國者下流，天下之牝，天下之交也。牝常以靜勝牡，以靜為下。故大國以下小國，則取小國；小國以下大國，則取大國。故或下以取，或下而取。大國不過欲兼畜人，小國不過欲入事人。夫兩者各得其所欲，大者宜為下。</p>
        <p>【要旨】
本章以水之就下、牝以靜勝為喻，闡明大國宜謙卑處下，小國亦宜謙順...</p>
