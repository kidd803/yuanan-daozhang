        <p>道德經第四十七章
【原文】
不出戶，知天下；不窺牖，見天道。
其出彌遠，其知彌少。
是以聖人不行而知，不見而名，不為而成。</p>
        <p>【要旨】
本章言內觀求道、不假外求，真知在於心合天道，聖人以無為而成事。</p>
        <p>【淺釋】
不必出門，即可推知天下事理；不望窗外，便能洞見自然規律。向外追逐越遠，真知反而越少。所以聖人不待出行而能知，不待親見而能明，不待妄為而能成就。</p>
