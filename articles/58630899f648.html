        <p>通靈覺知五十條正見問答(32)</p>
        <p>問：
孩童怕黑、易驚嚇、敏感爱哭，是通靈體質嗎？</p>
        <p>答：
孩童元神未固、後天俗念未染，
先天靈性本就敏銳，容易感知陰濁氣場、
懼怕暗處、無緣由哭鬧，是孩童靈性共性，
年長之後會漸漸鈍化。</p>
