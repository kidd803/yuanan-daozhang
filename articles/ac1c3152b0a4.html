        <p>圓安論氣功與丹道問與答(1)
問：丹道與氣功之差異</p>
        <p>答：丹道與氣功雖同屬內煉養生之術，
本質、修煉層次卻截然不同。</p>
        <p>氣功為後天修煉，以調身、调息、調心為核心，依後天意識導引、運轉後天濁氣，目的僅是疏通經絡、強身祛病、調和身心陰陽，屬順應人身生理的養生功法，著重形體與氣血調養，入門簡易、见效快速，但境界淺薄，僅止於色身健康層面。</p>
        <p>丹道乃是道家先天金丹大道...</p>
