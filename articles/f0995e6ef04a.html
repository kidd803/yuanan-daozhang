        <p>圓安論氣功與丹道問與答(18)</p>
        <p>問：
為何不可用意念刻意導氣、打通周天？</p>
        <p>答：
人身關竅為後天濁氣凝滯之處，後天意念、後天精氣根本無法穿透。執意以心念引氣衝關，只會擾亂周身氣機，導致氣脈紊亂、身心受損，是修煉走偏、滋生疾患的根源。真正通關，全賴先天真氣充足後的自然運化，而非人為造作。
 。</p>
