        <p>道德經第五十一章
【原文】
道生之，德畜之，物形之，勢成之。
是以萬物莫不尊道而貴德。
道之尊，德之貴，夫莫之命而常自然。
故道生之，德畜之，長之育之，亭之毒之，養之覆之。生而不有，為而不恃，
長而不宰，是謂玄德。</p>
        <p>【要旨】
本章闡明道為萬物生化之本，德為畜養萬物之用...</p>
