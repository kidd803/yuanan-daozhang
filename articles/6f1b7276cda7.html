        <p>原文：重為輕根，靜為躁君。是以君子終日行不離輜重。雖有榮觀，燕處超然。奈何萬乘之主，而以身輕天下？輕則失臣，躁則失君。</p>
        <p>白話譯：厚重是輕浮的根本，清靜是浮躁的主宰。因此有道之人終日行事，不離安穩厚重的根本。縱有榮華盛景，亦能從容安處，超然物外。為何身為萬乘之國的君主，卻以輕浮躁動之身治理天下？輕浮則失卻根本...</p>
