        <p>原文：重為輕根，靜為躁君。是以君子終日行不離輜重。雖有榮觀，燕處超然。奈何萬乘之主，而以身輕天下？輕則失臣，躁則失君。</p>
        <p>白話譯：厚重是輕浮的根本，清靜是浮躁的主宰。因此有道之人終日行事，不離安穩厚重的根本。縱有榮華盛景，亦能從容安處，超然物外。為何身為萬乘之國的君主，卻以輕浮躁動之身治理天下？輕浮則失卻根本...</p>
        </section>

    <script>
      document.querySelectorAll('[data-copy-url]').forEach((button) => {
        button.addEventListener('click', async () => {
          const share = button.closest('.preview-share');
          const input = share?.querySelector('input');
          const url = button.dataset.copyUrl || input?.value || location.href;
          let copied = false;
          try {
            if (navigator.clipboard?.writeText && window.isSecureContext) {
              await navigator.clipboard.writeText(url);
              copied = true;
            }
          } catch {}
          if (!copied && input) {
            input.focus();
            input.select();
            try {
              copied = document.execCommand('copy');
            } catch {}
          }
          button.textContent = copied ? '已複製' : '請手動複製';
          window.setTimeout(() => { button.textContent = '複製網址'; }, 1400);
        });
      });
