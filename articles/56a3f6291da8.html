        <p>問：
通靈者能否感知臨終之人、亡者殘留意識？</p>
        <p>答：
人命終之時，肉體元神解離，
脫離物質頻率。心性清淨的通靈者，
可感知亡者殘留心念、情緒與臨終畫面，
真實客觀、難以造假。</p>
