        <p>天道無常，浮生脆薄。世間萬象皆為浮幻遷流，唯性命本真、當下一念，最為真實。</p>
        <p>往歲前塵，皆為過影，執之不可留；來日未形，尚屬虛無，思之不可測。唯此時此刻之呼吸、萬物之見聞、本心之清寧，是吾人真實握有之造化。</p>
        <p>修道立身，不追既往之憾、不憂未來之虛。順時安住、惜取當下，便是順道而行...</p>
