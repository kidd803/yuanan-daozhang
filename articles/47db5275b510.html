        <p>道門養生：調心即養氣，息躁即養命</p>
        <p>七情者，人身氣機之開闔也。心氣清寧，則五臟調和；心念紛擾，則百脈壅滯。道家養生，不先補藥，而先養心；欲養其身，先調其情。</p>
        <p>浮生世路，起落無常、紛擾迭起，喜怒哀樂皆為人情之常。然世人多不知：情緒動於內，氣機變於中，身形損於外。善調七情、常守恬淡，便是惜身養命、全真葆元之上道。</p>
