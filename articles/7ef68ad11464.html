        <p>紫微斗數 祿存星 星性與組合解析

        <p>一、核心星性（口訣速記）
祿存陰土庫庫藏，穩重守成防破傷。
積財靠勤非僥倖，壽基穩固貴人幫。
孤克為性需吉化，祿馬交馳路路昌。</p>
