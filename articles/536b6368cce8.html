        <p>問：過去修行時，是否有過「越修越苦」的體驗？問題大概出在哪些地方？</p>
        <p>回答：很多同修都有過這種經歷，其實問題往往不在修行本身，而在方法偏了。
比如有人覺得修行就要捨棄一切，跟家人斷了聯繫，跟生活脫了軌，自然會苦。我們龍門方便法門，講的是在生活裡修行，越修越自在，越修越快樂...</p>

    <script>
      document.querySelectorAll('[data-copy-url]').forEach((button) => {
        button.addEventListener('click', async () => {
          const share = button.closest('.preview-share');
          const input = share?.querySelector('input');
          const url = button.dataset.copyUrl || input?.value || location.href;
          let copied = false;
          try {
            if (navigator.clipboard?.writeText && window.isSecureContext) {
              await navigator.clipboard.writeText(url);
              copied = true;
            }
          } catch {}
          if (!copied && input) {
            input.focus();
            input.select();
            try {
              copied = document.execCommand('copy');
            } catch {}
          }
          button.textContent = copied ? '已複製' : '請手動複製';
          window.setTimeout(() => { button.textContent = '複製網址'; }, 1400);
        });
