        <p>一、詩文原文</p>
        <p>莫愁詩
元 丘處機
衣食無虧便好休，人生世上一蜉蝣。
石崇未享千年富，韓信空成十面謀。
花落三春鶯帶恨，菊開九月雁含愁。
山林多少幽閒趣，何必榮封萬戶侯？</p>
        <p>二、白話譯文</p>
        <p>溫飽無憂便該知止，人活一世不過如蜉蝣般短暫。
昔年石崇富甲天下，終難保有萬家財富...</p>
