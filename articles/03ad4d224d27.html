        <p>【原文】
道生一，一生二，二生三，三生萬物。萬物負陰而抱陽，沖氣以為和。人之所惡，唯孤、寡、不穀，而王公以為稱。故物或損之而益，或益之而損。人之所教，我亦教之。強梁者不得其死，吾將以為教父。</p>
        <p>【要旨】
本章闡明天地生成之序，陰陽和氣為萬物之本；並明損益相因...</p>
