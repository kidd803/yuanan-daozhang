        <p>問：
為何有些人容易感召靈體靠近？</p>
        <p>答：
緣由有三：自身元氣虛弱、陽氣不足；常存悲傷、
恐懼、怨懟等負面情緒；長期心念陰沉、
低頻磁場堆積。同頻相感、陰氣相吸，
自然容易招感無形眾靈。</p>
