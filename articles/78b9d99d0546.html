        <p>【原文】
人之生也柔弱，其死也堅強。
萬物草木之生也柔脆，其死也枯槁。
故堅強者死之徒，柔弱者生之徒。
是以兵強則滅，木強則折。
強大處下，柔弱處上。</p>
