        <p>圓安論氣功與丹道問與答(34)</p>
        <p>問：
修丹道與世俗生活、工作是否衝突？</p>
        <p>答：
兩者毫無衝突，反而相輔相成。
丹道修煉是修心養性、保養身心，
在生活中做到不貪、不躁、不怨，
遇事心平氣和，收攝精气神，
即是行住坐臥皆在修煉。</p>
        <p>修煉所得的清靜身心，
更能讓人專注生活、高效處事，
是出世與入世的圓融。</p>
