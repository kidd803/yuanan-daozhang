        <p>道德經第五章 以《清靜經》互證解
道德經第五章原文：
天地不仁，以萬物為芻狗；
聖人不仁，以百姓為芻狗。
天地之間，其猶橐籥乎？
虛而不屈，動而愈出。
多言數窮，不如守中。</p>
        <p>一、天地不仁，以萬物為芻狗；聖人不仁，以百姓為芻狗
《清靜經》云：「大道無情，運行日月；大道無名，長養萬物。」
此處「不仁」非殘忍，乃無偏私、無愛憎之「清靜無情」。天地順道而行，不親不疏...</p>
