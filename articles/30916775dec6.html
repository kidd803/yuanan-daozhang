        <p>初觀山有徑，復歎海無垠。
風霜磨諸相，聚散了前塵。
命數雖天定，心燈獨可珍。
甘為雲外客，長惜眼前人。</p>
        <p>初入世途，望山川有路可尋，以為世事皆有定跡；及至歷練既深，方知滄海浩渺，大道廣漠無邊，人世際遇本無確切軌跡可執。歲月風霜消磨萬物外在形相，緣分聚散更迭，塵間往跡終歸消散，正是萬物氣聚則生、氣散則歸虛的自然規律。</p>
        <p>道家承認天數定分，一世之窮通禍福，自有陰陽氣數排布...</p>
