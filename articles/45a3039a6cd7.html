        <p>修身守道銘</p>
        <p>心可自寧，不為七情所縛、躁念所困。身倦則斂神靜養，神清則篤志躬行，不執偏隅妄念，不困無謂虛浮。</p>
        <p>身為載道之器，當惜元炁、謹守起居。四時有律，作息有度，飲食有節，順陰陽造化之序。身無疾擾、神無耗散，便是天道予人清寧真福。</p>
        <p>耳聞塵俗紛言，而本心湛然不搖。遠濁氛、絕冗事，澄方寸灵台，則胸懷疏闊...</p>
