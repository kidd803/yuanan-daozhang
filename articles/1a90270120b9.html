        <p>這一段最有意思的地方，
是古人還沒正式講法，先講人。</p>
        <p>《聖濟總錄》說，受法之前不得飲酒食肉五辛，連薑、乳、酪、酥、蜜也要禁；又要以井華水沐浴，衣服鮮淨，清齋七日。到了受法當天，還要再沐浴、漱口、燒香、禮五方五帝。</p>
        <p>這些規矩看似繁瑣，

          let copied = false;
          try {
            if (navigator.clipboard?.writeText && window.isSecureContext) {
              await navigator.clipboard.writeText(url);

          if (!copied && input) {
