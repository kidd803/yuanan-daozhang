        <p>十富謠
1. 不辭勞苦循正途，理當富。
2. 買賣公平招客眾，忠厚富。
3. 聞雞起舞離牀榻，勤奮富。
4. 手足不輟理家務，勞動富。
5. 謹防盜火嚴門戶，謹慎富。
6. 不蹈法紀不為非，守分富。
7. 合家同心相扶持，同心富。
8. 妻賢子孝無猜忌，幫家富。
9. 訓誨子孫立門庭，傳家富。
10. 存仁積德天垂護，為善富。</p>
