        <p>圓安論氣功與丹道問與答(31)</p>
        <p>問：
丹道修煉是否要學習各種法訣、招式？</p>
        <p>答：
丹道修煉重神不重形，重內不重外，
無需執著繁雜法訣、招式。
後天一切有形有相的功法，
皆是輔助入靜的手段，
核心依舊是培養先天真炁、抱元守一。
執著於法訣招式，便是捨本逐末，
落入後天造作，偏離大道正途。</p>
