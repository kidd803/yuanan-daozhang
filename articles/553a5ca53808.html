        <p>道德經第一章（精簡版）</p>
        <p>原文：道可道，非常道；名可名，非常名。無，名天地之始；有，名萬物之母。故常無，欲以觀其妙；常有，欲以觀其徼。此兩者，同出而異名，同謂之玄。玄之又玄，衆妙之門。</p>
        <p>釋要：首句開宗明義，區分「道」的兩重義涵：第一個「道」為宇宙本根、恆常规律，是形上之本體；第二個「道」為言說、表述，是人語言符號的界定...</p>
