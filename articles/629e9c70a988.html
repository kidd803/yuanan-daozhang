        <p>道德經第四十章
【原文】
反者道之動，弱者道之用。天下萬物生於有，有生於無。</p>
        <p>【要旨】
本章揭道之運行與作用，言返本復歸、柔弱為用，萬物終歸於無極之道。</p>
        <p>【淺釋】
道之運行，常向相反方向回歸，循環不已，是為「反」；道之發用，以柔弱謙下為體，不與物爭，是為「弱」。天下萬物皆由有形之「有」而生，而有形之有，復出於無形之「無」，無為道之本體，有為道之顯用。</p>
