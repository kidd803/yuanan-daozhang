        <p>莫愁詩
元·丘處機</p>
        <p>衣食無虧便好休，人生世上一蜉蝣。
石崇未享千年富，韓信空成十面謀。
花落三春鶯帶恨，菊開九月雁含愁。
山林多少幽閒趣，何必榮封萬戶侯？</p>
        <p>釋旨</p>
        <p>此詩為全真道祖丘處機傳世之作，載《磻溪集》。以知足戒貪、看破名利、順應自然為核心，盡顯道家曠達胸懷。</p>
        <p>- 首聯點明：溫飽足矣，人生如蜉蝣，短暫虛幻，不必貪求無度...</p>
