        <p>圓安論道：
道家改命修持口訣</p>
        <p>1. 先天有格局，後天可自主；天道無親，常與善人。
2. 我命在我不在天，還丹煉氣轉命盤。
3. 收心離境守一真，清靜澄心境自新。
4. 上药三品精气神，鼎爐人身煉三乘。
5. 禍福無門人自招，積善去惡福緣繞。
6. 觀天之道執天行，盜機合道性命寧。
7. 修心煉性積陰德，內丹實踐三層級。</p>
