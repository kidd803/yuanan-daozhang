        <p>今生皆是修行，當下即是道場</p>
        <p>浮華皮囊，千篇一律；
澄心悟道，萬中難尋。</p>
        <p>凡一切性命修持，唯在歸根復命，
返先天之本源，復自性之真淳。</p>
        <p>大道不在山林古觀，不在卷冊經文，
而在人間烟火、日用平常。</p>
        <p>躬身篤行，於起居動靜之間，
默參天地陰陽、四時運化之理。
守借假修真、借事煉心、借行養性之要，
以世間萬象磨洗心神，滌除塵妄，內觀自省，漸返本真道根。</p>
        <p>心清則道顯，無為則全真...</p>
