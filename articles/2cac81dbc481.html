        <p>原文：孔德之容，惟道是從。道之為物，惟恍惟惚。惚兮恍兮，其中有象；恍兮惚兮，其中有物；窈兮冥兮，其中有精。其精甚真，其中有信。自古及今，其名不去，以閱眾甫。吾何以知眾甫之狀哉？以此。</p>
        <p>白話譯解：大德之人的言行舉止，全然順從於道。道雖幽微難測、恍惚不定，卻在恍惚之中蘊含形象與實體...</p>
