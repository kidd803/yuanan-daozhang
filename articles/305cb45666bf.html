        <p>低谷少訴苦，悟此八言，三載翻身</p>
        <p>人身處困厄、運勢下行之時，切莫四處傾吐愁苦。世態炎涼，人情有別，自身艱辛難得旁人真心相扶。不如收斂心神，謹記此番箴言，順道修身、厚積篤行。</p>
        <p>勿時常嗟嘆貧乏，怨氣紛擾，必損元氣神思。用度當知節制，每月強行積蓄，以蓄立身之本。心中篤定前路自有轉機，思定方向便即刻踐行，莫陷空想內耗，徒耗光陰。</p>
        <p>虛浮宴飲、無謂交際盡當推卻。困厄之際...</p>
