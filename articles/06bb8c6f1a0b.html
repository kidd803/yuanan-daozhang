        <p>認識乩童文化問與答(15)</p>
        <p>問：
道教認可乩童儀式嗎？</p>
        <p>答：
正統道教多不認可，
道教經典認為上真天仙不附生人之體，
乩童附體之說多為邪魔外道，
與道教正統修持不符，
僅民間廟宇將其融入民俗儀式。</p>
