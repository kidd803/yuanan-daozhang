<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>圓安道語</title>
    <link rel="stylesheet" href="styles.css?v=20260724-course-stack">
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div class="brand-lockup">
          <figure class="portrait-frame">
            <img class="brand-photo" src="assets/yuanan-daozhang.jpg" alt="圓安道長">
          </figure>
          <div class="brand-copy">
            <p class="eyebrow">公開文章查詢</p>
            <h1>圓安道語</h1>
            <div class="lineage" aria-label="介紹">
              <span>全真龍門派</span>
              <span>圓安道長</span>
              <span>河南鹿邑道教祖庭傳承</span>
            </div>
            <p id="summary">資料載入中</p>
          </div>
        </div>
        <div class="search-panel" aria-label="文章篩選">
          <label class="field search-field">
            <span>搜尋</span>
            <input id="searchInput" type="search" placeholder="搜尋道語、分類、系列或日期">
          </label>
          <label class="field">
            <span>年份</span>
            <select id="yearSelect">
              <option value="全部年份">全部年份</option>
            </select>
          </label>
          <label class="field">
            <span>排序</span>
            <select id="sortSelect">
              <option value="newest">新到舊</option>
              <option value="oldest">舊到新</option>
            </select>
          </label>
        </div>
      </header>

      <nav class="quick-searches" aria-label="常用主題">
        <button type="button" data-query="因果">因果</button>
        <button type="button" data-query="修行">修行</button>
        <button type="button" data-query="靜心">靜心</button>
        <button type="button" data-query="道德經">道德經</button>
        <button type="button" data-query="氣功">氣功</button>
        <button type="button" data-query="畫符">畫符</button>
        <button type="button" data-query="通靈">通靈</button>
        <button type="button" data-query="紫微斗數">紫微斗數</button>
      </nav>

      <nav id="seriesBar" class="series-tabs" aria-label="系列"></nav>
      <nav id="categoryBar" class="categories" aria-label="分類"></nav>

      <section class="layout">
        <aside class="stats" aria-label="統計"></aside>
        <section class="results" aria-label="文章列表">
          <div class="result-head">
            <h2 id="resultTitle">全部文章</h2>
            <p id="resultMeta"></p>
          </div>
          <div id="postList" class="post-list"></div>
          <button id="loadMoreButton" class="load-more" type="button">顯示更多</button>
        </section>
        <article id="reader" class="reader" aria-label="文章內容"></article>
      </section>
    </main>

    <aside class="course-order" aria-label="圓安道長課程下單">
      <a class="course-order-image-link" href="https://reurl.cc/GgVRVd" target="_blank" rel="noreferrer">
        <img src="assets/yuanan-dandao-course.jpg" alt="圓安丹道入門線上試播課">
      </a>
      <div class="course-order-copy">
        <p class="course-order-kicker">圓安道長課程下單</p>
        <h2>圓安丹道入門線上試播課</h2>
        <p>9月21日 20:30 開課，9/22、9/23、9/24 續播，每堂約90分鐘。</p>
        <ul>
          <li>FB 線上直播</li>
          <li>體驗價 299元</li>
          <li>台灣含講義 399元，運費70元</li>
        </ul>
        <a class="course-order-button" href="https://reurl.cc/GgVRVd" target="_blank" rel="noreferrer">立即報名下單</a>
      </div>
    </aside>

    <template id="postTemplate">
      <article class="post-card" tabindex="0" role="button">
        <div class="post-meta">
          <time></time>
          <span class="category"></span>
        </div>
        <h2></h2>
        <p class="excerpt"></p>
        <ul class="tags"></ul>
      </article>
    </template>

    <script src="data/posts.js?v=20260724-course-stack"></script>
    <script src="app.js?v=20260724-course-stack"></script>
  </body>
</html>
